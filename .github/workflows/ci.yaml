name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Actions are pinned to full commit SHAs; the comment names the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: make check
        run: make check
      - name: make lint
        run: make lint
      - name: make race
        run: make race
      - name: make arch (builds for Windows)
        run: make arch
      - name: make consumer (netctl as a dependency)
        run: make consumer
      - name: API changes since the latest tag (report only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          git fetch --tags --force --unshallow || git fetch --tags --force
          make apidiff
